
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meturtv.app'
    compileSdk 34

    
    defaultConfig {
        applicationId "com.meturtv.app"
        minSdk 21
        targetSdk 34

        versionCode = providers.gradleProperty("VERSION_CODE")
            .getOrElse("1").toInteger()

        versionName = providers.gradleProperty("VERSION_NAME")
            .getOrElse("2.4.0")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'

    // Native authenticated streaming (HLS, DASH and progressive HTTP media)
    def media3Version = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:${media3Version}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
    implementation "androidx.media3:media3-ui:${media3Version}"
}
