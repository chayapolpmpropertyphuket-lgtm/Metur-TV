
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meturtv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.meturtv.app"
        minSdk 21
        targetSdk 34

        // Automatically supplied by GitHub Actions
        versionCode (project.findProperty("VERSION_CODE") ?: "1").toInteger()
        versionName project.findProperty("VERSION_NAME") ?: "2.4.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
