
name: Build Metur TV APK and Create Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metur-tv-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository and tags
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Generate automatic version
      - name: Generate Release Version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          LATEST_TAG=$(git tag --list 'v[0-9]*' \
            --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)

          if [ -z "$LATEST_TAG" ]; then
            VERSION="2.4.0"
          else
            VERSION="${LATEST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            PATCH=$((PATCH + 1))

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          echo "Release version: ${TAG}"
          echo "Android versionCode: ${VERSION_CODE}"

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Install dependencies
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # 5. Build website
      - name: Build Web Application
        run: npm run build

      # 6. Verify dist
      - name: Verify Web Build
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder not found!"
            exit 1
          fi

      # 7. Copy web files into Android
      - name: Copy Web Build to Android
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -R dist/. android/app/src/main/assets/dist/

      # 8. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 9. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 10. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 11. Verify Gradle wrapper
      - name: Verify Gradle Wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ERROR: android/gradlew not found!"
            exit 1
          fi

          chmod +x android/gradlew

      # 12. Build APK with automatic version
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PVERSION_CODE=${{ steps.version.outputs.version_code }} \
            -PVERSION_NAME=${{ steps.version.outputs.version }} \
            --no-daemon

      # 13. Verify and rename APK
      - name: Prepare APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK file not found!"
            exit 1
          fi

          mkdir -p release

          cp "$APK_PATH" \
            "release/Metur-TV-${{ steps.version.outputs.tag }}.apk"

      # 14. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Metur TV ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/Metur-TV-${{ steps.version.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
