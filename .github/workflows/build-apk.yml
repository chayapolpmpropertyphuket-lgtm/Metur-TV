
name: Build Metur TV APK and Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metur-tv-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Generate Version
      - name: Generate Release Version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          LATEST_TAG=$(git tag --list 'v[0-9]*' \
            --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)

          if [ -z "$LATEST_TAG" ]; then
            VERSION="2.4.0"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          TAG="v${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

          echo "Release: ${TAG}"
          echo "Version Code: ${VERSION_CODE}"

      # 3. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Dependencies
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # 5. Build Website
      - name: Build Web Application
        run: npm run build

      # 6. Verify dist
      - name: Verify Web Build
        run: |
          test -d dist || {
            echo "ERROR: dist folder not found!"
            exit 1
          }

      # 7. Copy Web Files
      - name: Copy Web Build to Android
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -R dist/. android/app/src/main/assets/dist/

      # 8. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 9. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 10. Install Gradle 8.4 directly
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # 11. Verify Android Project
      - name: Verify Android Project
        run: |
          if [ ! -f android/settings.gradle ] && \
             [ ! -f android/settings.gradle.kts ]; then
            echo "ERROR: Android Gradle settings not found!"
            exit 1
          fi

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android app build file not found!"
            exit 1
          fi

      # 12. Build APK without requiring gradlew
      - name: Build Release APK
        working-directory: android
        run: |
          gradle assembleRelease \
            -PVERSION_CODE=${{ steps.version.outputs.version_code }} \
            -PVERSION_NAME=${{ steps.version.outputs.version }} \
            --no-daemon

      # 13. Verify APK
      - name: Prepare APK
        run: |
          echo "Searching for APK..."

          find android/app/build/outputs/apk -type f -name "*.apk" || true

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected release APK not found!"
            echo "Checking build outputs..."
            find android/app/build/outputs -type f || true
            exit 1
          fi

          mkdir -p release

          cp "$APK_PATH" \
            "release/Metur-TV-${{ steps.version.outputs.tag }}.apk"

      # 14. Publish Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Metur TV ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/Metur-TV-${{ steps.version.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
