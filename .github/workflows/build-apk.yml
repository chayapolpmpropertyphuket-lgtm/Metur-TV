name: Build Metur TV Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Install Node.js dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build web application
        run: npm run build

      - name: Verify web build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::The dist directory was not created. Check your web build output directory."
            exit 1
          fi
          if [ -z "$(find dist -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error::The dist directory is empty."
            exit 1
          fi

      - name: Copy web build into Android assets
        run: |
          mkdir -p android/app/src/main/assets/dist
          rm -rf android/app/src/main/assets/dist/*
          cp -a dist/. android/app/src/main/assets/dist/

      - name: Verify Gradle Wrapper
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Gradle Wrapper is missing. Add android/gradlew and android/gradle/wrapper/gradle-wrapper.properties to your repository."
            exit 1
          fi
          chmod +x android/gradlew

      - name: Build Android TV Release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK output
        run: |
          APK_COUNT=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No release APK was generated."
            exit 1
          fi
          find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MeturTV-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
