name: Validate Android TV APK

on:
  push:
    branches:
      - feature/blank-first-run-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metur-tv-android-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Build Android TV debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Copy web build into Android assets
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -R dist/. android/app/src/main/assets/dist/
          test -s android/app/src/main/assets/dist/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Assemble release APK
        working-directory: android
        run: |
          gradle assembleRelease \
            -PVERSION_CODE=2004000 \
            -PVERSION_NAME=2.4.0 \
            --no-daemon

      - name: Verify APK artifacts
        run: |
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Metur-TV-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: Metur-TV-Android-release-test-debug-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
